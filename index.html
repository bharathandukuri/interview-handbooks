<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0D12'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h14' stroke='%234A90E2' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Interview Handbooks</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem("ihb:settings:v1")
          var theme = "dark"
          var fontScale = 1
          if (raw) {
            var parsed = JSON.parse(raw)
            var state = parsed && parsed.state ? parsed.state : parsed
            if (
              state &&
              (state.theme === "dark" ||
                state.theme === "light" ||
                state.theme === "system")
            ) {
              theme = state.theme
            }
            if (state && typeof state.fontScale === "number") {
              fontScale = state.fontScale
            }
          }
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme
          var root = document.documentElement
          root.classList.remove("dark", "light")
          root.classList.add(resolved)
          root.style.setProperty("--font-scale", String(fontScale))
        } catch (_err) {
          // Ignore storage errors and keep dark default
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
